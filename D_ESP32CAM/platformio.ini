[platformio]
default_envs = esp32cam

[env:esp32cam]
; PlatformIO Espressif32 7.0.1 uses Arduino-ESP32 2.0.17,
; which matches the API style used by the supplied example.
platform = espressif32 @ 7.0.1
board = esp32cam
framework = arduino

board_build.f_cpu = 240000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
upload_speed = 115200
upload_protocol = esptool

; Use the partition table supplied with the Arduino example.
board_build.partitions = partitions.csv

; Avoid some USB-UART adapters toggling the board when opening the monitor.
monitor_dtr = 0
monitor_rts = 0

monitor_filters =
    esp32_exception_decoder
